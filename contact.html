<style>
:root { --paper:#F3F1EB; --ink:#151515; --ink-soft:#5B5953; --hair:rgba(21,21,21,.18); --water:#2F45C6; --rust:#B9400F;
  --sans:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif; --serif:"Instrument Serif","Times New Roman",Times,serif; --gutter:clamp(16px,1.4vw,24px); --cond: var(--sans); --cond-stretch: 75%; --disp: 0.6; --body: 0.85; --ser: 1;
  color-scheme: light; }
/* type scale settled by Gautami: big headings at 60%, body at 85% on screens wider than a phone */
@media (max-width: 760px) { :root { --body: 1; } }
html, body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
:focus-visible { outline:1.5px solid var(--water); outline-offset:3px; }
.cond { font-family: var(--cond); font-stretch: var(--cond-stretch); font-weight:600; }
.top { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:max(10px, env(safe-area-inset-top,0px)) var(--gutter) 0; background:var(--paper); }
.top a { min-height:44px; display:inline-flex; align-items:center; font-size:17px; text-transform:uppercase; font-family: var(--cond); font-stretch: var(--cond-stretch); font-weight:500; }
.top nav { display:flex; gap:20px; }
.top a:hover, .top a[aria-current] { text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1.5px; }
main { padding: clamp(80px,14vh,160px) var(--gutter) 96px; }
.label { font-size:15px; color:var(--rust); text-transform:uppercase; margin:0 0 14px; }
h1 { margin:0 0 clamp(40px,6vw,80px); font-size:calc(clamp(54px,9vw,150px) * var(--disp)); line-height:.86; text-transform:uppercase; font-family: var(--cond); font-stretch: var(--cond-stretch); font-weight:700; letter-spacing:-.02em; }
.note { font-size:15px; color:var(--ink-soft); margin-top:48px; }

.email { font-size:clamp(30px,4.4vw,72px); font-weight:700; letter-spacing:-.04em; margin:0 0 8px; overflow-wrap:anywhere; user-select:all; }
.copy { font:inherit; background:none; border:0; padding:0; cursor:pointer; color:var(--water); text-transform:uppercase; font-family: var(--cond); font-stretch: var(--cond-stretch); font-weight:600; font-size:16px; min-height:44px; }
.links { margin-top:40px; border-top:1px solid var(--hair); max-width:760px; }
.links > * { display:grid; grid-template-columns:100px minmax(0,1fr); gap:16px; padding:12px 0 11px; border-bottom:1px solid var(--hair); font-size:17px; }
.links .k { font-family: var(--cond); font-stretch: var(--cond-stretch); font-weight:600; color:var(--ink-soft); }
.top { transition: transform .5s cubic-bezier(.2,.75,.15,1); }
.top.away { transform: translateY(-110%); }
.foot { border-top:1px solid var(--hair); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px 24px; padding:18px var(--gutter) max(22px, env(safe-area-inset-bottom,0px)); font-size:15px; }
.foot .k { color:var(--ink-soft); }
.foot a:hover { color:var(--water); }
@media (max-width:760px) { .top nav { gap:12px; } .top a { font-size:15px; } }
</style>
</head>
<body>
<header class="top">
  <a href="index.html#home" aria-label="Gautami Kasat, home">GK</a>
  <nav aria-label="Main">
    <a href="work.html">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
</header>
<main>
<p class="label cond">[Contact]</p>
<h1>Say hello</h1>
<p class="email" id="email">gautami.kasat@gmail.com</p>
<button class="copy" type="button" id="copy">Copy email</button>
<div class="links">
  <a href="https://www.linkedin.com/in/gautamikasat" target="_blank" rel="noopener"><span class="k">LinkedIn</span><span>linkedin.com/in/gautamikasat</span></a>
</div>
<script>
document.getElementById('copy').addEventListener('click', async (e) => {
  const b = e.currentTarget, t = document.getElementById('email');
  try { await navigator.clipboard.writeText(t.textContent.trim()); b.textContent = 'Copied'; }
  catch (err) { const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected, press copy'; }
  setTimeout(() => { b.textContent = 'Copy email'; }, 2200);
});
</script>
</main>
<footer class="foot">
  <a href="mailto:gautami.kasat@gmail.com">gautami.kasat@gmail.com</a>
  <span><a href="https://www.linkedin.com/in/gautamikasat" target="_blank" rel="noopener">LinkedIn</a> <span class="k">|</span> <a href="https://github.com/gautamik01" target="_blank" rel="noopener">GitHub</a></span>
</footer>
<script>
(() => {
  const top = document.querySelector('.top'); let lastY = scrollY, upRun = 0;
  addEventListener('scroll', () => {
    const y = Math.max(0, scrollY), atBottom = y + innerHeight >= document.documentElement.scrollHeight - 4;
    if (y < 80) { top.classList.remove('away'); upRun = 0; }
    else if (y > lastY) { upRun = 0; top.classList.add('away'); }
    else if (y < lastY && !atBottom) { upRun += lastY - y; if (upRun > 48) top.classList.remove('away'); }
    lastY = y;
  }, { passive: true });
})();
</script>
</body>
</html>
